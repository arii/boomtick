[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tokens-with-taste"
version = "0.1.0"
description = "Local catalog-backed LLM waterfall and token audit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "httpx>=0.27,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
twt = "twt.cli:main"

[tool.setuptools]
packages = ["twt"]

[tool.setuptools.package-data]
twt = ["providers.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
