name: 'BoomTick AI Code Review'
description: 'Runs standalone AI code review in Docker container'
# Minimal use on a pull_request workflow (needs `permissions: pull-requests: write`):
#   - uses: actions/checkout@v7
#     with: { fetch-depth: 0 }
#   - uses: arii/boomtick@<ref>
#     with:
#       gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
#       fail-on-verdict: 'true'   # optional: fail the step when the verdict is FAIL
# Outputs: `verdict` (pass|warn|fail|unknown) and `blocking-findings` (message listing blocking findings).
inputs:
  github-app-id:
    description: "GitHub App ID"
    required: false
  github-app-private-key:
    description: "GitHub App private key (PEM string)"
    required: false
  github-token:
    description: "Token used to read the PR and post the review when no GitHub App credentials are given"
    required: false
    default: ${{ github.token }}
  pr-number:
    description: "Pull request to review; defaults to the triggering pull_request event"
    required: false
    default: ${{ github.event.pull_request.number }}
  gemini-api-key:
    description: "Gemini API key for synthesis"
    required: true
  fail-on-verdict:
    description: "Fail the step when the AI review verdict is FAIL (warn and pass stay green; hard errors always fail)"
    required: false
    default: 'false'
outputs:
  verdict:
    description: "AI review verdict: pass, warn, fail or unknown"
  blocking-findings:
    description: "Message naming the blocking findings when the verdict is fail"
runs:
  using: 'docker'
  image: 'Dockerfile'
  env:
    GITHUB_APP_ID: ${{ inputs.github-app-id }}
    GITHUB_APP_PRIVATE_KEY: ${{ inputs.github-app-private-key }}
    GITHUB_TOKEN: ${{ inputs.github-token }}
    GEMINI_API_KEY: ${{ inputs.gemini-api-key }}
    BOOMTICK_PR_NUMBER: ${{ inputs.pr-number }}
    BOOMTICK_FAIL_ON_VERDICT: ${{ inputs.fail-on-verdict }}
