[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boomtick-cli"
version = "1.0.0"
description = "Standalone CLI and MCP orchestration tools for BoomTick & TechDancer ecosystem"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0",
    "pydantic>=2.0.0",
    "mcp>=1.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
td-cli = "dev_tools.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dev_tools*"]
