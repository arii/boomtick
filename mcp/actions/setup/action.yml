name: BoomTick Setup
description: Comprehensive setup including checkout, node/pnpm, workspace, and MCP build
runs:
  using: composite
  steps:
    - name: Configure Git Safe Directory
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      shell: bash

    - name: Setup Workspace
      uses: arii/boomtick/.github/actions/setup-workspace@3e970a570aee0a550ec6409de769c201c9a5b900 # boomtick main (cli-v0.20.2 + unreleased fixes)

    - name: Verify setup
      run: td doctor
      shell: bash
