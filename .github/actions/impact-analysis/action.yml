name: 'BoomTick Standalone Impact Analysis'
description: 'Runs visual diffs and deployment impact analysis using pre-built containerized tools'

inputs:
  github_token:
    description: 'GitHub token for PR commenting and API checks'
    required: true
  gemini_api_key:
    description: 'Gemini API key for review synthesis'
    required: false
  openai_api_key:
    description: 'OpenAI API key for main agent processing'
    required: false
  jules_api_key:
    description: 'Jules API key for agent execution'
    required: false
  container_image:
    description: 'Container image (with tag) to use for the analysis'
    required: false
    default: 'ghcr.io/arii/boomtick:latest'

runs:
  using: 'composite'
  steps:
    - name: Execute Impact Analysis in Container
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        GEMINI_API_KEY: ${{ inputs.gemini_api_key }}
        OPENAI_API_KEY: ${{ inputs.openai_api_key }}
        JULES_API_KEY: ${{ inputs.jules_api_key }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        # 1. Run Impact Analysis
        docker run --rm \
          --entrypoint /workspace/node_modules/.bin/tsx \
          -e GITHUB_TOKEN="${GITHUB_TOKEN}" \
          -e GEMINI_API_KEY="${GEMINI_API_KEY}" \
          -e JULES_API_KEY="${JULES_API_KEY}" \
          -e OPENAI_API_KEY="${OPENAI_API_KEY}" \
          -e PR_NUMBER="${PR_NUMBER}" \
          -e GITHUB_REPOSITORY="${GITHUB_REPOSITORY}" \
          -v "${{ github.workspace }}":/github/workspace \
          -w /github/workspace \
          ${{ inputs.container_image }} \
          /workspace/scripts/impact-analysis.ts

        # 2. Run Gemini Code Review
        if [ -n "${GEMINI_API_KEY}" ]; then
          docker run --rm \
            --entrypoint /workspace/node_modules/.bin/tsx \
            -e GITHUB_TOKEN="${GITHUB_TOKEN}" \
            -e GEMINI_API_KEY="${GEMINI_API_KEY}" \
            -e JULES_API_KEY="${JULES_API_KEY}" \
            -e PR_NUMBER="${PR_NUMBER}" \
            -e GITHUB_REPOSITORY="${GITHUB_REPOSITORY}" \
            -v "${{ github.workspace }}":/github/workspace \
            -w /github/workspace \
            ${{ inputs.container_image }} \
            /workspace/scripts/impact-ai-code-review.ts gemini
        fi

        # 3. Run OpenAI Code Review
        if [ -n "${OPENAI_API_KEY}" ]; then
          docker run --rm \
            --entrypoint /workspace/node_modules/.bin/tsx \
            -e GITHUB_TOKEN="${GITHUB_TOKEN}" \
            -e OPENAI_API_KEY="${OPENAI_API_KEY}" \
            -e JULES_API_KEY="${JULES_API_KEY}" \
            -e PR_NUMBER="${PR_NUMBER}" \
            -e GITHUB_REPOSITORY="${GITHUB_REPOSITORY}" \
            -v "${{ github.workspace }}":/github/workspace \
            -w /github/workspace \
            ${{ inputs.container_image }} \
            /workspace/scripts/impact-ai-code-review.ts github-models
        fi

    - name: Parse Jules session ID from PR description
      if: always()
      id: parse_jules
      env:
        PR_BODY: ${{ github.event.pull_request.body }}
      run: |
        TASK_ID=$(echo "$PR_BODY" | grep -oP 'jules\.google\.com/task/\K[0-9]+' | head -1 || true)
        if [ -z "$TASK_ID" ]; then
          echo "No Jules task ID found in PR description. Skipping."
          exit 0
        fi
        echo "Found Jules task ID: $TASK_ID"
        echo "task_id=$TASK_ID" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Send impact analysis to Jules session
      if: always() && steps.parse_jules.outputs.task_id != ''
      env:
        TASK_ID: ${{ steps.parse_jules.outputs.task_id }}
        JULES_API_KEY: ${{ inputs.jules_api_key }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        PYTHONPATH: ${{ github.workspace }}/cli
      run: |
        TARGET_PATH="${{ github.action_path }}/../../../scripts/send-jules-impact.py"
        if [ -f "$TARGET_PATH" ]; then
          RESOLVED_PATH=$(realpath "$TARGET_PATH")
          echo "Executing send-jules-impact.py at: $RESOLVED_PATH"
          python3 "$RESOLVED_PATH"
        else
          # Fallback check for docker run execution or direct python script in checkout workspace
          # Inside container execution, scripts/send-jules-impact.py should exist in workspace
          if [ -f "scripts/send-jules-impact.py" ]; then
            echo "Executing send-jules-impact.py from current workspace."
            python3 scripts/send-jules-impact.py
          else
            echo "⚠️ Skipping: send-jules-impact.py script not found."
          fi
        fi
      shell: bash
