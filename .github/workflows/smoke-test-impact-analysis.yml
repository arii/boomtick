name: Smoke Test Impact Analysis
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:
    inputs:
      pr-number:
        description: 'Explicit PR Number fallback'
        required: false
        default: ''
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke-test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate App Token
        id: app-token
        uses: ./.github/actions/generate-token
        with:
          app_id: ${{ secrets.APP_ID }}
          app_private_key: ${{ secrets.APP_PRIVATE_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if Container Image exists
        id: check-image
        run: |
          IMAGE_TAG="ghcr.io/arii/boomtick:${{ github.sha }}"
          if docker pull "$IMAGE_TAG"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Build and Load Container Image
        if: steps.check-image.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ghcr.io/arii/boomtick:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # This job tests deterministic integration, not substantive AI approval.
      # The separate Deployment Impact Analysis workflow remains unchanged.
      - name: Smoke Test Deterministic Composite Integration
        uses: ./.github/actions/impact-analysis
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          pr-number: ${{ inputs.pr-number }}
          container_image: ghcr.io/arii/boomtick:${{ github.sha }}

      - name: Assert Composite Impact Artifacts
        shell: bash
        run: |
          test -s artifacts/impact-analysis.json
          test -s artifacts/impact-analysis/impact.md
          jq -e '(.changedFiles | type == "array") and (.routes | type == "array") and (.impactLevel | IN("LOW", "MEDIUM", "HIGH"))' artifacts/impact-analysis.json

      - name: Smoke Test Real Container Review Contracts Offline
        shell: bash
        run: |
          # Production image/entrypoint and the mounted script run with network disabled.
          # The harness mocks HTTP only inside temporary child processes, never production.
          docker run --rm --network none \
            -v "${{ github.workspace }}":/github/workspace \
            -w /github/workspace \
            ghcr.io/arii/boomtick:${{ github.sha }} \
            node /github/workspace/scripts/smoke-review-offline.mjs /workspace/dist
