name: Smoke Test Impact Analysis
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      pr-number:
        description: 'Explicit PR Number fallback'
        required: false
        default: ''
        type: string

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Smoke Test Impact Analysis Action
        uses: arii/boomtick/.github/actions/impact-analysis@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          gemini_api_key: "MOCK_KEY"
          jules_api_key: "MOCK_KEY"
          pr-number: ${{ inputs.pr-number }}
