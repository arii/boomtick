name: Smoke Test Impact Analysis
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:
    inputs:
      pr-number:
        description: 'Explicit PR Number fallback'
        required: false
        default: ''
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke-test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test the docs gate
        run: python3 -m unittest discover -s cli/tests -p test_ci_docs_only.py

      - name: Classify changed paths
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci-docs-only.py

      - name: Generate App Token
        if: steps.diff.outputs.docs_only != 'true'
        id: app-token
        uses: ./.github/actions/generate-token
        with:
          app_id: ${{ secrets.APP_ID }}
          app_private_key: ${{ secrets.APP_PRIVATE_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.diff.outputs.docs_only != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: steps.diff.outputs.docs_only != 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if Container Image exists
        if: steps.diff.outputs.docs_only != 'true'
        id: check-image
        run: |
          IMAGE_TAG="ghcr.io/arii/boomtick:${{ github.sha }}"
          if docker pull "$IMAGE_TAG"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Build and Load Container Image
        if: steps.diff.outputs.docs_only != 'true' && steps.check-image.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ghcr.io/arii/boomtick:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify missing-key review fails loudly offline
        if: steps.diff.outputs.docs_only != 'true'
        env:
          IMAGE_TAG: ghcr.io/arii/boomtick:${{ github.sha }}
        run: |
          rm -f artifacts/gemini-code-review-verdict.json artifacts/gemini-code-review.md
          status=0
          docker run --rm --network none \
            -v "${{ github.workspace }}":/github/workspace \
            -w /github/workspace \
            "$IMAGE_TAG" node /workspace/dist/runner.cjs gemini || status=$?
          test "$status" -eq 1
          jq -e '.passed == false and .skipReason == "MISSING_API_KEY"' \
            artifacts/gemini-code-review-verdict.json
          grep -q 'Skipped: No GEMINI_API_KEY provided' artifacts/gemini-code-review.md

      - name: Smoke Test Impact Analysis Action
        if: steps.diff.outputs.docs_only != 'true'
        uses: ./.github/actions/impact-analysis
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          # Review failure is tested offline above, never send a fake key to a live provider.
          gemini_api_key: ""
          pr-number: ${{ inputs.pr-number }}
          container_image: ghcr.io/arii/boomtick:${{ github.sha }}
