name: Smoke Test Impact Analysis
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if Container Image exists
        id: check-image
        run: |
          IMAGE_TAG="ghcr.io/arii/boomtick:${{ github.sha }}"
          if docker pull "$IMAGE_TAG"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Build and Load Container Image
        if: steps.check-image.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ghcr.io/arii/boomtick:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke Test Impact Analysis Action
        uses: arii/boomtick/.github/actions/impact-analysis@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          gemini_api_key: "MOCK_KEY"
          jules_api_key: "MOCK_KEY"
          container_image: ghcr.io/arii/boomtick:${{ github.sha }}
