name: Synchronized Multi-Target Release Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - 'cli-v*'
      - 'mcp-v*'
      - 'action-v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run publish'
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  publish-artifacts:
    name: Build & Publish Synchronized Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python CLI Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -e cli

      - name: Install Node Dependencies
        run: pnpm install --frozen-lockfile

      - name: Test & Build MCP Server
        run: |
          pnpm --filter @arii/boomtick-mcp test
          pnpm --filter @arii/boomtick-mcp build

      - name: Sync Schemas and Contracts
        run: pnpm run verify:schemas

      - name: Publish MCP to npm
        if: (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && inputs.dry_run != true
        run: pnpm --filter @arii/boomtick-mcp publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        continue-on-error: true

      - name: Bundle MCP into CLI & Build Python Wheel
        run: |
          mkdir -p cli/dev_tools/dist
          cp -r mcp/dist/* cli/dev_tools/dist/
          cd cli
          python3 -m pip install --upgrade build
          python3 -m build

      - name: Publish CLI to PyPI
        if: (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && inputs.dry_run != true
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: cli/dist/
        continue-on-error: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/arii/boomtick-review
            ghcr.io/arii/boomtick
          tags: |
            type=match,pattern=v(.*),group=1
            type=match,pattern=cli-v(.*),group=1
            type=match,pattern=mcp-v(.*),group=1
            type=match,pattern=action-v(.*),group=1
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and Load Docker Image for Verification
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: boomtick-review:test
          cache-from: type=gha

      - name: Verify Container Pure-Node Footprint & Size Budget
        run: |
          echo "::group::Asserting zero Python binaries in review container"
          if docker run --rm boomtick-review:test sh -c "command -v python || command -v python3 || command -v pip || command -v pip3" >/dev/null 2>&1; then
            echo "::error::Python runtime or pip binaries detected in review container! Container must remain pure-Node."
            exit 1
          fi
          echo "✅ Verified zero Python / pip binaries inside container."
          echo "::endgroup::"

          echo "::group::Asserting Node.js 24 runtime and runner bundle"
          NODE_VERSION=$(docker run --rm boomtick-review:test node --version)
          echo "Node.js version in container: $NODE_VERSION"
          if [[ "$NODE_VERSION" != v24* ]]; then
            echo "::error::Expected Node.js 24, found $NODE_VERSION"
            exit 1
          fi
          docker run --rm boomtick-review:test test -f /workspace/dist/runner.cjs
          echo "✅ Node.js 24 and dist/runner.cjs verified."
          echo "::endgroup::"

          echo "::group::Asserting Image Size Budget"
          SIZE_BYTES=$(docker image inspect boomtick-review:test --format='{{.Size}}')
          SIZE_MB=$((SIZE_BYTES / 1024 / 1024))
          echo "Uncompressed image size: ${SIZE_MB}MB"
          if [ "$SIZE_MB" -gt 250 ]; then
            echo "::error::Container uncompressed image size (${SIZE_MB}MB) exceeds max budget limit (250MB uncompressed / 150MB compressed)."
            exit 1
          fi
          echo "✅ Container size (${SIZE_MB}MB uncompressed) conforms to size budget."
          echo "::endgroup::"

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && inputs.dry_run != true }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
