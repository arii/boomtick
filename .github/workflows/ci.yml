name: CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [ "main" ]
    paths:
      - '**'
      - '.github/workflows/**'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to check out in boomtick'
        default: 'main'
        required: false
        type: string
    secrets:
      GEMINI_API_KEY:
        required: false
      JULES_API_KEY:
        required: false

concurrency:
  # Safe concurrency group targeting the current branch.
  # security-safe: This string is used solely as an internal GitHub identifier to queue/cancel runs.
  # It is never evaluated or executed in a shell or command context, so there is zero risk of script/command injection.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read
  pull-requests: write
  models: read
  issues: write
  actions: read

jobs:
  scope-check:
    name: Scope Constraint Validation
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - name: Run Scope Verification Check
        run: |
          python3 scripts/verify-scope.py --strict-scope

  workflow-lint:
    name: GitHub Actions Lint
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Check workflow files with actionlint
        run: |
          # Download and install actionlint
          curl -sLS https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash
          ./actionlint -ignore "constant expression .* in condition" -ignore "unknown Webhook event \"dependabot_alert\"" .github/workflows/*.yml

  lint-typecheck:
    name: Lint & Typecheck (${{ matrix.target }})
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run'
    strategy:
      fail-fast: false
      matrix:
        target: [typescript, python]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Workspace
        uses: ./.github/actions/setup-workspace

      - name: Run Lint & Typecheck (TypeScript)
        if: matrix.target == 'typescript'
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @arii/boomtick-mcp run lint
          pnpm --filter @arii/boomtick-mcp run type-check

      - name: Run Lint & Typecheck (Python)
        if: matrix.target == 'python'
        run: |
          pnpm run bootstrap:python
          pnpm run lint:python
          pnpm run type-check:python

  audit:
    name: Anti-Pattern & Code Smell Checks
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Workspace
        uses: ./.github/actions/setup-workspace

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Duplication Detection (jscpd)
        run: pnpm exec jscpd .

  test-build:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Workspace
        uses: ./.github/actions/setup-workspace

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run MCP Tests (Vitest)
        run: pnpm --filter @arii/boomtick-mcp run test

      - name: Run Python CLI Tests (pytest)
        run: |
          pnpm run bootstrap:python
          pnpm run test:python

  impact-analysis:
    name: Deployment Impact Analysis
    runs-on: ubuntu-latest
    needs: [workflow-lint, lint-typecheck, audit, test-build]
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_call'
    container: ghcr.io/${{ github.repository }}/ai-workspace-runner:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - name: Configure Git Safe Directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
        shell: bash

      - name: Restore pre-built node_modules
        run: |
          if [ -d "/workspace/node_modules" ]; then
            echo "Restoring node_modules from container cache..."
            mv /workspace/node_modules ./node_modules
            mkdir -p ./mcp
            if [ -d "/workspace/mcp/node_modules" ]; then
              mv /workspace/mcp/node_modules ./mcp/node_modules
            fi
          else
            echo "⚠️ Pre-built node_modules not found. Falling back to dynamic installation."
            pnpm install --frozen-lockfile
          fi
        shell: bash

      - name: Run Deployment Impact Analysis
        uses: ./mcp/actions/impact-analysis
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          pr_number: ${{ github.event.pull_request.number }}
          jules_api_key: ${{ secrets.JULES_API_KEY }}

