name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [ "**" ]
    paths:
      - '**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      pr-number:
        description: 'Explicit PR Number fallback'
        required: false
        default: ''
        type: string
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to check out in boomtick'
        default: 'main'
        required: false
        type: string
      pr-number:
        description: 'Explicit PR Number fallback'
        required: false
        default: ''
        type: string
    secrets:
      GEMINI_API_KEY:
        required: false
      OPENAI_API_KEY:
        required: false
      APP_ID:
        required: false
      APP_PRIVATE_KEY:
        required: false

concurrency:
  # Safe concurrency group targeting the current branch.
  # security-safe: This string is used solely as an internal GitHub identifier to queue/cancel runs.
  # It is never evaluated or executed in a shell or command context, so there is zero risk of script/command injection.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: read
  pull-requests: write
  models: read
  issues: write
  actions: read

jobs:
  changes:
    name: Classify CI changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Test the docs gate
        run: python3 -m unittest discover -s cli/tests -p test_ci_docs_only.py
      - name: Classify changed paths
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci-docs-only.py

  release-version-safety:
    name: Release Version Safety
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Test release version safety
        run: python3 -m unittest discover -s cli/tests -p test_release_versions.py
      - name: Reject reused or regressing release versions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check-release-versions.py --base "$BASE_SHA" --head "$HEAD_SHA"

  tokens-with-taste:
    name: Tokens with Taste (Python 3.11)
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run'
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tokens-with-taste
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tokens-with-taste/pyproject.toml
      - run: python -m pip install '.[test]'
      # Unit suite reports but does not block (#1489). Job name is unchanged so required-check names stay valid.
      - run: python -m pytest -v
        continue-on-error: true

  verify-dependencies:
    timeout-minutes: 15
    name: Verify Dependencies via Dynamic Path
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Workspace
        uses: ./.github/actions/setup-workspace
        with:
          setup-python: 'false'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Dependency Cruiser via Dynamic Path
        run: pnpm exec depcruise --config .dependency-cruiser.config.mjs src

      - name: Run TSX Script via Dynamic Path
        run: pnpm exec tsx scripts/check-runtime-files.mjs

  workflow-lint:
    timeout-minutes: 10
    name: GitHub Actions Lint
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Check workflow files with actionlint
        run: |
          # Download and install actionlint
          curl -sLS https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash
          ./actionlint -ignore "constant expression .* in condition" -ignore "unknown Webhook event \"dependabot_alert\"" .github/workflows/*.yml

  lint-typecheck:
    timeout-minutes: 30
    name: Lint & Typecheck (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ always() && !cancelled() && github.event_name != 'workflow_run' && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    strategy:
      fail-fast: false
      matrix:
        target: [typescript, python]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Workspace
        uses: ./.github/actions/setup-workspace

      - name: Run Lint & Typecheck (TypeScript)
        if: matrix.target == 'typescript'
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @arii/boomtick-mcp run lint
          pnpm --filter @arii/boomtick-mcp run type-check
          pnpm --filter @arii/boomtick-workflows run lint
          pnpm run type-check:ts

      - name: Run Lint & Typecheck (Python)
        if: matrix.target == 'python'
        run: |
          pnpm run lint:python
          pnpm run type-check:python
          pnpm run lint:format

  audit:
    timeout-minutes: 30
    name: Anti-Pattern & Code Smell Checks
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Workspace
        uses: ./.github/actions/setup-workspace

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Duplication Detection (jscpd)
        run: pnpm exec jscpd .

      - name: Run Code Audit (Fallow)
        run: pnpm run audit:fallow

      - name: Run AI Slop Fail-Gate
        run: python3 .agents/scripts/audit-ai-slop.py

  test-build:
    timeout-minutes: 60
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ always() && !cancelled() && github.event_name != 'workflow_run' && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Workspace
        uses: ./.github/actions/setup-workspace

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # Unit suites report but do not block (#1489). Job name is unchanged so required-check names stay valid.
      - name: Run MCP Tests (Vitest)
        continue-on-error: true
        run: pnpm --filter @arii/boomtick-mcp run test

      - name: Run Workflow Tests (Vitest)
        continue-on-error: true
        run: pnpm --filter @arii/boomtick-workflows run test

      - name: Run Python CLI Tests (pytest)
        continue-on-error: true
        run: |
          pnpm run test:python

  impact-analysis:
    timeout-minutes: 30
    name: Deployment Impact Analysis
    runs-on: ubuntu-latest
    needs: [workflow-lint, lint-typecheck, audit, test-build]
    if: ${{ always() && !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'workflow_call') && !startsWith(github.head_ref, 'release-please--') && needs.workflow-lint.result == 'success' && needs.audit.result == 'success' && (needs.lint-typecheck.result == 'success' || needs.lint-typecheck.result == 'skipped') && (needs.test-build.result == 'success' || needs.test-build.result == 'skipped') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - name: Generate App Token
        id: app-token
        uses: ./.github/actions/generate-token
        with:
          app_id: ${{ secrets.APP_ID }}
          app_private_key: ${{ secrets.APP_PRIVATE_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if Container Image exists
        id: check-image
        run: |
          IMAGE_TAG="ghcr.io/arii/boomtick:${{ github.sha }}"
          if docker pull "$IMAGE_TAG"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Build and Load Container Image
        if: steps.check-image.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ghcr.io/arii/boomtick:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Deployment Impact Analysis
        uses: ./.github/actions/impact-analysis
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          pr-number: ${{ inputs.pr-number }}
          container_image: ghcr.io/arii/boomtick:${{ github.sha }}

  validate-and-analyze:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    # Activated in downstream repositories; disabled locally to prevent circular action.yml resolution before merge
    if: false
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate App Token
        id: app-token
        uses: ./.github/actions/generate-token
        with:
          app_id: ${{ secrets.APP_ID }}
          app_private_key: ${{ secrets.APP_PRIVATE_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if Container Image exists
        id: check-image-validate
        run: |
          IMAGE_TAG="ghcr.io/arii/boomtick:${{ github.sha }}"
          if docker pull "$IMAGE_TAG"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Build and Load Container Image
        if: steps.check-image-validate.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ghcr.io/arii/boomtick:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Standalone Impact Analysis
        uses: ./.github/actions/impact-analysis
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          pr-number: ${{ inputs.pr-number }}
          container_image: ghcr.io/arii/boomtick:${{ github.sha }}
